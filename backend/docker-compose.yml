services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${NAME_BD}
      POSTGRES_USER: ${USER_BD}
      POSTGRES_PASSWORD: ${PASSWORD_BD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${USER_BD} -d ${NAME_BD}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      HOST_BD: db
      PORT_BD: "5432"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

volumes:
  postgres_data:
